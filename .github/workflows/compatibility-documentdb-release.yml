name: Compatibility DocumentDB releases

on:
  push:
    branches: [main]
    paths:
      - compatibility/registry.yaml

permissions:
  contents: read

jobs:
  dispatch:
    name: Test added or re-pinned DocumentDB releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install trusted orchestration dependencies
        run: python -m pip install -r compatibility/requirements.txt
      - name: Dispatch the compatibility workflow for each changed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          previous="$RUNNER_TEMP/previous-registry.yaml"
          if ! git show "$BEFORE:compatibility/registry.yaml" > "$previous"; then
            echo "The previous registry is unavailable, so every reviewed release is dispatched."
            : > "$previous"
          fi
          releases=$(python -m compatibility.workflow changed-releases --previous "$previous")
          for release in $releases; do
            printf 'Dispatching compatibility runs for DocumentDB %s\n' "$release"
            gh workflow run compatibility.yml --ref "$GITHUB_REF_NAME" \
              -f integration=all -f documentdb_version="$release" -f trigger=documentdb_release
          done
