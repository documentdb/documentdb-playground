name: Compatibility infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "compatibility/**"
      - ".github/workflows/compatibility*"
      - ".github/aw/actions-lock.json"
      - ".github/ISSUE_TEMPLATE/compatibility-report.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "compatibility/**"
      - ".github/workflows/compatibility*"
      - ".github/aw/actions-lock.json"
      - ".github/ISSUE_TEMPLATE/compatibility-report.yml"

concurrency:
  group: compatibility-infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-unit-tests:
    name: Compatibility infrastructure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install compatibility development dependencies
        run: python -m pip install -r compatibility/requirements-dev.txt
      - name: Check scoped Python formatting and types
        run: |
          python -m black --check --config compatibility/pyproject.toml compatibility
          python -m isort --check-only --settings-path compatibility/pyproject.toml compatibility
          python -m flake8 --max-line-length=100 --extend-ignore=E203 compatibility
          python -m mypy --config-file compatibility/pyproject.toml compatibility
      - name: Run compatibility unit tests
        run: python -m pytest -c compatibility/pyproject.toml compatibility/unit
      - name: Check the trusted Git history publisher
        run: shellcheck compatibility/persist.sh
      - name: Check the README dashboard publisher
        run: shellcheck compatibility/publish-readme.sh
      - name: Check the compiled compatibility watcher
        run: |
          compiler="$RUNNER_TEMP/gh-aw"
          curl --fail --location --silent --show-error --max-time 120 \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 \
            --output "$compiler"
          printf '%s  %s\n' \
            1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b \
            "$compiler" | sha256sum --check --status
          chmod +x "$compiler"
          "$compiler" compile compatibility-watcher \
            --action-mode release --strict --validate --no-check-update
          git diff --exit-code -- .github/workflows/compatibility-watcher.lock.yml \
            .github/aw/actions-lock.json
      - name: Check JavaScript reporting and dashboard freshness
        run: |
          image=$(sed -n 's/^FROM //p' compatibility/integrations/nodejs/Dockerfile)
          docker run --rm --read-only --network none --user 1000:1000 \
            --tmpfs /tmp:size=64m --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace "$image" \
            node --test compatibility/unit/test_freshness.cjs compatibility/unit/test_nodejs.cjs
