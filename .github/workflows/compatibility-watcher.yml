name: Upstream compatibility watcher

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: compatibility-upstream-watcher
  cancel-in-progress: false

jobs:
  discover:
    name: Discover eligible upstream releases
    if: ${{ vars.COMPATIBILITY_WATCHER_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install trusted watcher dependencies
        run: python -m pip install -r compatibility/requirements.txt
      - name: Discover and durably record eligible releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPATIBILITY_WATCHER_ENABLED: ${{ vars.COMPATIBILITY_WATCHER_ENABLED }}
        run: python -m compatibility.watcher discover
  dispatch:
    name: Dispatch reviewed compatibility profiles
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install trusted watcher dependencies
        run: python -m pip install -r compatibility/requirements.txt
      - name: Reconcile receipts and dispatch at most three reviewed version pairs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPATIBILITY_WATCHER_ENABLED: ${{ vars.COMPATIBILITY_WATCHER_ENABLED }}
        run: python -m compatibility.watcher dispatch
