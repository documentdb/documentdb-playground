# Database Spring Data connects to. Overridden by the scripts (MONGO_DB env var).
spring.data.mongodb.database=${MONGO_DB:springdata_demo}

# Let Spring Data create indexes from the @Document annotations at startup.
# DocumentDB builds them asynchronously; avoid `collation` (not implemented).
spring.data.mongodb.auto-index-creation=true

# REST API port (overridden by the scripts via the PORT env var).
server.port=${PORT:3000}

spring.main.banner-mode=off
logging.level.org.mongodb.driver=warn
logging.level.org.springframework.data.mongodb=warn
